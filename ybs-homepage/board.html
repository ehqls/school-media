
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="영주고등학교 YBS 익명 게시판">
  <title>익명 게시판 | YBS 방송부</title>

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/community.css">
  <link rel="stylesheet" href="css/board.css">
</head>

<body class="board-page">

  <header class="header">
    <a href="index.html" class="logo">
      <span class="logo-icon">Y</span>
      <span>
        <strong>영주고등학교</strong>
        <small>YBS 방송부</small>
      </span>
    </a>

    <nav class="nav">
      <a href="index.html">홈페이지</a>
      <a href="community.html">커뮤니티</a>
      <a href="board.html" class="active">익명 게시판</a>
    </nav>
  </header>

  <main class="community-container">

    <section class="community-hero">
      <span class="community-eyebrow">YBS ANONYMOUS BOARD</span>

      <h1>익명 게시판</h1>

      <p>
        학교 구성원들과 나누고 싶은 이야기를<br>
        자유롭게 익명으로 작성해 보세요.
      </p>

      <div id="boardStatus" class="community-status">
        로그인 상태를 확인하고 있습니다.
      </div>
    </section>

    <section class="community-panel" id="write">

      <div class="community-heading">
        <div>
          <span class="community-label">WRITE ANONYMOUS POST</span>
          <h2>익명 게시글 작성</h2>
          <p>작성한 글은 관리자 승인 후 커뮤니티에 공개됩니다.</p>
        </div>
      </div>

      <form id="postForm">

        <label for="postTitle">제목</label>

        <input
          type="text"
          id="postTitle"
          maxlength="100"
          placeholder="제목을 입력하세요."
          required
        >

        <label for="postContent">내용</label>

        <textarea
          id="postContent"
          rows="8"
          maxlength="5000"
          placeholder="내용을 입력하세요."
          required
        ></textarea>

        <button type="submit" id="submitPost" class="primary-button">
          익명 게시글 제출
        </button>

        <div id="writeMessage" class="community-message"></div>

      </form>

    </section>

    <section class="community-panel" id="adminModeration" hidden>

      <div class="community-heading">
        <div>
          <span class="community-label">POST MODERATION</span>
          <h2>게시글 승인 관리</h2>
          <p>승인 대기 중인 익명 게시글을 검토합니다.</p>
        </div>

        <button type="button" id="refreshPending" class="secondary-button">
          새로고침
        </button>
      </div>

      <div id="pendingPosts" class="post-list">
        게시글을 불러오는 중입니다.
      </div>

    </section>

    <footer class="community-footer">
      <a href="community.html">커뮤니티로 돌아가기</a>
      <p>YEONGJU HIGH SCHOOL · YBS</p>
    </footer>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/board.js"></script>

</body>
</html>
