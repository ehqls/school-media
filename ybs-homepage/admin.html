
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>YBS 관리자 대시보드</title>

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/admin.css">

  <style>
    .member-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .member-actions button {
      padding: 8px 13px;
      border: none;
      border-radius: 7px;
      cursor: pointer;
      font-weight: 600;
    }

    .edit-button {
      background: #2563eb;
      color: white;
    }

    .role-button {
      background: #475569;
      color: white;
    }

    .approve-button {
      background: #16a34a;
      color: white;
    }

    .reject-button {
      background: #dc2626;
      color: white;
    }

    .member-actions button:disabled {
      opacity: .5;
      cursor: wait;
    }
  </style>
</head>

<body>

  <header class="header">
    <div class="container">
      <h1>YBS 관리자 센터</h1>
      <p>YEONGJU HIGH SCHOOL · BROADCASTING CLUB</p>
    </div>
  </header>

  <main class="container">

    <section class="hero">
      <div>
        <p class="admin-label">ADMINISTRATION</p>
        <h2>관리자 대시보드</h2>
        <p id="adminStatus">관리자 권한을 확인하고 있습니다.</p>
      </div>
    </section>

    <section id="adminContent" hidden>

      <div class="dashboard-heading">
        <div>
          <h2>회원 현황</h2>
          <p>YBS 홈페이지 회원 현황을 확인합니다.</p>
        </div>
      </div>

      <section class="stats-grid">

        <article class="stat-card">
          <span>전체 회원</span>
          <strong id="totalMembers">-</strong>
          <small>등록된 전체 계정</small>
        </article>

        <article class="stat-card pending-card">
          <span>승인 대기</span>
          <strong id="pendingMembers">-</strong>
          <small>관리자 확인 필요</small>
        </article>

        <article class="stat-card approved-card">
          <span>승인 완료</span>
          <strong id="approvedMembers">-</strong>
          <small>서비스 이용 승인</small>
        </article>

        <article class="stat-card rejected-card">
          <span>가입 거절</span>
          <strong id="rejectedMembers">-</strong>
          <small>승인되지 않은 계정</small>
        </article>

      </section>

      <section class="management-panel">

        <div class="panel-heading">
          <div>
            <h2>회원 관리</h2>
            <p>가입 신청자와 등록 회원을 관리합니다.</p>
          </div>

          <button id="refreshButton" type="button">
            새로고침
          </button>
        </div>

        <div class="member-tools">

          <input
            type="search"
            id="memberSearch"
            placeholder="회원 이름 검색"
            autocomplete="off"
          >

          <select id="statusFilter">
            <option value="all">전체 상태</option>
            <option value="pending">승인 대기</option>
            <option value="approved">승인 완료</option>
            <option value="rejected">가입 거절</option>
          </select>

        </div>

        <div id="memberList" class="member-list">
          회원 목록을 불러오는 중입니다.
        </div>

      </section>

      <footer class="admin-footer">
        <button id="logoutButton" type="button">
          로그아웃
        </button>

        <a href="index.html">
          홈페이지로 돌아가기
        </a>
      </footer>

    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/admin.js" defer></script>

</body>
</html>
