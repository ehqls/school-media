
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>학교 익명 게시판</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <p class="eyebrow">SCHOOL MEDIA</p>
      <h1>익명 게시판</h1>
      <p>여러분의 이야기를 들려주세요.</p>
    </div>
  </header>

  <nav class="nav">
    <a href="#write">글 작성</a>
    <a href="#board">공개 게시판</a>
    <button id="adminToggle" class="admin-button">관리자 로그인</button>
  </nav>

  <main>
    <section id="write" class="panel">
      <h2>익명으로 글 작성하기</h2>
      <p class="description">
        작성한 글은 관리자 검토 후 공개됩니다.
        이름이나 전화번호 등 개인정보는 작성하지 마세요.
      </p>

      <form id="postForm">
        <label for="postTitle">제목</label>
        <input
          id="postTitle"
          type="text"
          maxlength="60"
          placeholder="제목을 입력하세요."
          required
        >

        <label for="postContent">내용</label>
        <textarea
          id="postContent"
          rows="6"
          maxlength="2000"
          placeholder="내용을 입력하세요."
          required
        ></textarea>

        <button class="primary-button" type="submit">
          검토 요청하기
        </button>
      </form>

      <p id="formMessage" class="message" aria-live="polite"></p>
    </section>

    <section id="adminPanel" class="panel hidden">
      <h2>관리자 페이지</h2>
      <p class="description">
        제출된 글을 확인하고 승인하거나 반려하세요.
      </p>

      <div class="admin-stats">
        <span>검토 대기: <strong id="pendingCount">0</strong></span>
        <span>공개 게시글: <strong id="approvedCount">0</strong></span>
      </div>

      <div id="pendingPosts" class="post-list"></div>

      <button id="adminLogout" class="secondary-button">
        관리자 로그아웃
      </button>
    </section>

    <section id="board" class="panel">
      <h2>공개 게시판</h2>
      <p class="description">
        관리자 승인이 완료된 글만 표시됩니다.
      </p>
      <div id="publicPosts" class="post-list"></div>
    </section>
  </main>

  <footer>
    <p>SCHOOL MEDIA · 익명 게시판 실험 버전</p>
  </footer>
</body>
</html>
